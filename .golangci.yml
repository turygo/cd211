version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused

  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*os.File).Close
        - (*os.Root).Close
        - (*mime/multipart.Form).RemoveAll
        - os.Remove
        - os.RemoveAll
    staticcheck:
      checks:
        - "all"
        # Rewriting the hex-digit range checks with De Morgan's law reads worse
        # than the original conditions.
        - "-QF1001"

  exclusions:
    rules:
      # Tests deliberately ignore returns from setup helpers and cleanup calls.
      - path: _test\.go
        linters: [errcheck]
      # The CloudDrive2 contract test dials a real server and needs the blocking
      # DialContext behaviour NewClient does not provide.
      - path: internal/clouddrive/grpc_contract_test\.go
        linters: [staticcheck]
      # Generated by protoc and sqlc; regenerate instead of editing.
      - path: internal/clouddrive/pb/
        linters: [errcheck, govet, staticcheck, unused]
      - path: internal/store/sqlc/
        linters: [errcheck, govet, staticcheck, unused]
