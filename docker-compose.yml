services:
  cd211:
    image: turygo/cd211:latest
    container_name: cd211
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - CD211_USERNAME=${CD211_USERNAME}
      - CD211_PASSWORD=${CD211_PASSWORD}
      - CD2_ADDRESS=${CD2_ADDRESS}
      - CD2_USERNAME=${CD2_USERNAME}
      - CD2_PASSWORD=${CD2_PASSWORD}
      - CD2_INSECURE=${CD2_INSECURE:-false}
      - CLOUD_ROOT=${CLOUD_ROOT:-/115open/云下载}
      # Staging directories are created as 2770 PUID:PGID. CloudDrive2, Sonarr,
      # and Radarr must run in the same PGID group, and CloudDrive2 must use
      # umask 002 so CD211 can delete the content it copied.
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
    volumes:
      # SQLite requires a host-local filesystem with POSIX locking; NFS and SMB
      # mounts are unsupported for /data.
      - cd211_data:/data
      # Must be the same staging root CloudDrive2 copies into, and Sonarr and
      # Radarr must see it under the same path they use for import.
      - ./downloads:/downloads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  cd211_data:
