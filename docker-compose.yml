services:
  cd211:
    image: turygo/cd211:latest
    container_name: cd211
    restart: unless-stopped
    ports:
      - "8080:8080"
    # The binary reads no environment variables: its HTTP address and database
    # path are command-line flags. The defaults below match the image, so no
    # override is usually needed; if you must change them, pass a command:
    #   command: ["--http-address", ":8080"]
    environment:
      # All service configuration (CloudDrive2 connection, cloud/local paths,
      # timeouts) happens in the first-run web setup wizard and is stored in
      # SQLite; no CD2_* or CLOUD_ROOT environment variables are read.
      #
      # Staging directories are created as 2770 PUID:PGID, so CloudDrive2,
      # Sonarr, and Radarr must all run in the PGID group. CloudDrive2 must also
      # start with umask 0002, otherwise CD211 cannot delete what it copied; the
      # official image needs an entrypoint override for that:
      #   entrypoint: ["/bin/sh", "-c", "umask 0002; exec /clouddrive/clouddrive"]
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
    volumes:
      # SQLite requires a host-local filesystem with POSIX locking; NFS and SMB
      # mounts are unsupported for /data.
      - cd211_data:/data
      # CloudDrive2 must mount this same host directory at this same container
      # path, because CD211 hands its own save path to CloudDrive2 as the copy
      # destination. Sonarr and Radarr also import from this path.
      - ./downloads:/downloads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  cd211_data:
