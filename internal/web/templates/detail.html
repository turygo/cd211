{{define "detail"}}<!doctype html>
<html lang="{{.Lang}}">
{{template "head" .}}
<body>
  <div class="app-shell">
    {{template "sidebar" .}}
    <main class="content" id="main-content">
      <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/">{{.Str.NavDownloads}}</a><span aria-hidden="true">/</span><code>{{.Hash}}</code></nav>
      <header class="page-header detail-header">
        <div class="page-title">
          <h1>{{.Name}}</h1>
          <span class="state-badge" data-live-badge data-state="{{.InternalState}}">{{.StateLabel}}</span>
        </div>
      </header>

      {{template "detail-live" .}}
      <p class="visually-hidden" role="status" data-live-announcer aria-live="polite"></p>
    </main>
  </div>
  <script type="module" src="/static/downloads-live.js?v=1"></script>
</body>
</html>{{end}}
