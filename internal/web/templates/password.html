{{define "password"}}<!doctype html>
<html lang="{{.Lang}}">
{{template "head" .}}
<body>
  <div class="app-shell">
    {{template "sidebar" .}}
    <main class="content" id="main-content">
      <header class="page-header">
        <div class="page-title">
          <h1>{{.Str.TitlePassword}}</h1>
        </div>
      </header>
      <p class="page-lede">{{.Str.PasswordLede}}</p>

      <section class="panel panel-narrow">
        {{if .Error}}<div class="notice notice-error" role="alert">{{.Error}}</div>{{end}}
        {{if .Success}}<div class="notice notice-success" role="status">{{.Str.PasswordChanged}}</div>{{end}}
        <form action="/password" method="post" class="stack-form">
          <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
          <input type="hidden" name="username" value="admin" autocomplete="username">
          <label for="current-password">{{.Str.CurrentPassword}}</label>
          <input id="current-password" name="current_password" type="password" autocomplete="current-password" required>
          <label for="new-password">{{.Str.NewPassword}}</label>
          <input id="new-password" name="new_password" type="password" autocomplete="new-password" required minlength="8">
          <label for="confirm-password">{{.Str.ConfirmPassword}}</label>
          <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required minlength="8">
          <button class="button button-primary" type="submit">{{.Str.ChangeButton}}</button>
        </form>
      </section>
    </main>
  </div>
</body>
</html>{{end}}
