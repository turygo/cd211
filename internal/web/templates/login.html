{{define "login"}}<!doctype html>
<html lang="{{.Lang}}">
{{template "head" .}}
<body class="login-page">
  <main class="login-shell">
    <div class="login-card">
      <div class="login-top">
        <div class="login-brand"><span class="brand-mark" aria-hidden="true">CD</span><span class="brand-name">CD211</span><span class="brand-version">{{appVersion}}</span></div>
        <a class="lang-toggle" href="/lang?to={{.OtherLang}}&amp;back={{.Path}}" rel="nofollow">{{.Str.SwitchLang}}</a>
      </div>
      <h1>{{.Str.TitleSignIn}}</h1>
      <p class="login-hint">{{.Str.LoginHint}}</p>
      {{if .Error}}<div class="notice notice-error" role="alert">{{.Error}}</div>{{end}}
      <form action="/login" method="post" class="stack-form">
        <label for="username">{{.Str.Username}}</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">{{.Str.Password}}</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="button button-primary" type="submit">{{.Str.SignIn}}</button>
      </form>
    </div>
  </main>
</body>
</html>{{end}}
