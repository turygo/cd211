{{define "head"}}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · CD211</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
{{end}}

{{define "sidebar"}}
<aside class="sidebar">
  <a class="brand" href="/" aria-label="CD211 home">
    <span class="brand-mark" aria-hidden="true">CD</span>
    <span class="brand-name">CD211</span>
  </a>
  <nav class="side-nav" aria-label="Primary navigation">
    <a class="nav-item" href="/" {{if eq .ActiveNav "downloads"}}aria-current="page"{{end}}>{{.Str.NavDownloads}}</a>
    <a class="nav-item" href="/categories" {{if eq .ActiveNav "categories"}}aria-current="page"{{end}}>{{.Str.NavCategories}}</a>
    <a class="nav-item" href="/settings" {{if eq .ActiveNav "settings"}}aria-current="page"{{end}}>{{.Str.NavSettings}}</a>
  </nav>
  <div class="sidebar-foot">
    <a class="lang-toggle" href="/password" {{if eq .ActiveNav "password"}}aria-current="page"{{end}}>{{.Str.NavPassword}}</a>
    <a class="lang-toggle" href="/lang?to={{.OtherLang}}&amp;back={{.Path}}" rel="nofollow">{{.Str.SwitchLang}}</a>
    <form action="/logout" method="post">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <button class="button button-ghost" type="submit">{{.Str.SignOut}}</button>
    </form>
  </div>
</aside>
{{end}}

{{define "route-strip"}}
<div class="stage-strip" role="group" aria-label="{{.State}}">
  {{range .Stages}}
  <div class="stage {{.Class}}" title="{{.Label}}: {{.Status}}">
    <span class="stage-head"><span class="stage-label">{{.Label}}</span><span class="stage-status">{{.Status}}</span></span>
    <span class="stage-bar"><span class="stage-fill" style="width: {{.Progress}}%"></span></span>
  </div>
  {{end}}
</div>
{{end}}
