{{define "webhook-secret"}}<!doctype html>
<html lang="{{.Lang}}">
{{template "head" .}}
<body>
  <div class="app-shell">
    {{template "sidebar" .}}
    <main class="content" id="main-content">
      <header class="page-header">
        <div class="page-title">
          <h1>{{.Str.SecretTitle}}</h1>
        </div>
      </header>
      <p class="page-lede">{{.Str.SecretLede}}</p>

      <section class="panel panel-narrow" aria-labelledby="secret-reveal-title">
        <h2 id="secret-reveal-title" class="visually-hidden">{{.Str.SecretTitle}}</h2>
        <p class="muted">{{.EndpointName}}</p>
        <p class="secret-label">{{.Str.SecretLabel}}</p>
        <code class="secret-value" data-webhook-secret>{{.Secret}}</code>
        <div class="button-row">
          <a class="button button-primary" href="/webhooks">{{.Str.SecretDone}}</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>{{end}}
