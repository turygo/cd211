name: CI

# Pushes to main and release tags are checked by the Publish workflow, which
# runs the same gate before it pushes an image.
on:
  pull_request:
    branches: [main]

jobs:
  gate:
    name: Gate
    uses: ./.github/workflows/gate.yml

  image:
    name: Image Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      # Build only the native platform on pull requests; the multi-arch push
      # happens in the Publish workflow.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
