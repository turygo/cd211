name: Gate

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          # `config verify` downloads a JSONSchema from golangci-lint.run, which
          # makes the gate fail whenever that host is slow or unreachable.
          verify: false

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: go test ./... -count=1

  build:
    name: Static Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      # Release images are CGO-free; a build that only works with CGO must fail
      # here rather than during the image build.
      - run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/cd211
