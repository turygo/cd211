name: Docker

on:
  push:
    tags: ['v*']

jobs:
  gate:
    name: Gate
    uses: ./.github/workflows/gate.yml

  docker:
    name: Build and Push Image
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The Dockerfile cross-compiles from the runner's native arch, so QEMU is
      # only needed for the arm64 runtime stage.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            turygo/cd211:${{ steps.version.outputs.version }}
            turygo/cd211:latest
